name: Build

on:
  # 发布 Release 时自动构建并把产物传到该 Release
  release:
    types: [published]
  # 手动触发：产物作为 Actions artifact 下载；填了 tag 则同时上传到该 Release
  workflow_dispatch:
    inputs:
      tag:
        description: "（可选）把产物上传到这个已存在的 Release tag，例如 v0.1.0；留空则只产出 Actions artifact"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 单个目标失败不影响其它目标继续产出
      fail-fast: false
      matrix:
        include:
          # ---------------- Windows ----------------
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            exe: ".exe"
            features: tls-rustls
            cross: false
            nightly: false

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            exe: ".exe"
            # Windows 上 tls-native = SChannel，纯 API 绑定，不用为 ARM64 交叉编译 C 代码
            features: tls-native
            cross: false
            nightly: false

          # ---------------- macOS ----------------
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            exe: ""
            features: tls-rustls
            cross: false
            nightly: false

          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            exe: ""
            features: tls-rustls
            cross: false
            nightly: false

          # ---------------- Linux ----------------
          # 全部走 cross。rustls 的加密后端（aws-lc-rs / ring）不支持
          # riscv64 / mips / 32 位 ARM，因此统一使用 vendored OpenSSL：
          # OpenSSL 会被静态编进二进制，产出物不依赖目标机的 libssl。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            features: tls-native-vendored
            cross: true
            nightly: false

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            features: tls-native-vendored
            cross: true
            nightly: false

          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            features: tls-native-vendored
            cross: true
            nightly: false

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            features: tls-native-vendored
            cross: true
            nightly: false

          # mips 只构建 64 位版本：32 位 mips-unknown-linux-gnu 在依赖层就过不去
          # —— rmcp / tokio 需要 std::sync::atomic::AtomicU64，而 MIPS32 没有 64 位原子操作。
          # mips64 是 Tier 3（rustup 不发布 std），因此用 nightly + build-std。
          - target: mips64-unknown-linux-gnuabi64
            os: ubuntu-latest
            archive: tar.gz
            exe: ""
            features: tls-native-vendored
            cross: true
            nightly: true

    steps:
      - uses: actions/checkout@v7

      # ---------------- 版本号（用于产物命名） ----------------
      - name: Resolve version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            v="$REL_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            v="$INPUT_TAG"
          else
            v="0.0.0-dev.${SHA:0:7}"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "产物版本：$v"

      # ---------------- 工具链 ----------------
      - name: Install Rust (stable)
        if: ${{ !matrix.nightly }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust (nightly + rust-src，Tier-3 目标需要)
        if: ${{ matrix.nightly }}
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup MSVC ARM64 cross toolchain
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      # Windows runner 的 PATH 里存在 Git 自带的 /usr/bin/link.exe（coreutils 的 link），
      # 会抢在 MSVC link.exe 之前被 rustc 选中，导致 "extra operand ... .rlib"。
      # 这里不去动 PATH，直接把目标链接器钉死到 MSVC 的 ARM64 link.exe。
      - name: Pin ARM64 linker
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $root = $env:VCToolsInstallDir
          if (-not $root) { throw "VCToolsInstallDir 未设置，msvc-dev-cmd 没有生效" }
          $candidates = @(
            (Join-Path $root "bin\Hostx64\arm64\link.exe"),
            (Join-Path $root "bin\Hostarm64\arm64\link.exe")
          )
          $linker = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $linker) { throw "找不到 ARM64 link.exe，候选：$($candidates -join ' | ')" }
          Write-Host "使用链接器：$linker"
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$linker" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}-${{ matrix.features }}

      # ---------------- 构建 ----------------
      - name: Build (cross)
        if: ${{ matrix.cross && !matrix.nightly }}
        run: cross build --release --locked --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      - name: Build (cross + build-std，Tier-3 目标)
        if: ${{ matrix.cross && matrix.nightly }}
        run: cross build --release --locked --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }} -Z build-std=std,panic_abort

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}

      # ---------------- 打包 ----------------
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "weather-mcp-cn-$env:VERSION-${{ matrix.target }}"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/weather-mcp-cn${{ matrix.exe }}" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$name.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="weather-mcp-cn-${VERSION}-${{ matrix.target }}"
          stage="stage/${name}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/weather-mcp-cn" "$stage/"
          cp README.md LICENSE "$stage/"
          tar -C stage -czf "dist/${name}.tar.gz" "${name}"
          ls -l dist

      # ---------------- 产物 ----------------
      # 手动触发时从这里下载：Actions → 运行详情 → Artifacts
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: weather-mcp-cn-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # Release 触发（或手动填写了 tag）时自动上传到 Release
      - name: Upload to GitHub Release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          echo "上传到 Release: $TAG"
          gh release upload "$TAG" dist/* --clobber
